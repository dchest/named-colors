      display: block;
      width: 100%;
      margin: 0.5em 0;
      font-size: 1em;

    #colorBox {
      width: 100%;
      height: 80px;
      border: 1px solid silver;
      margin-top: 1em;
    }

    #mixedBox {
      width: 100%;
      height: 80px;
      border: 1px solid silver;
      margin-top: 1em;
    }

    blockquote {
      color: gray;
      line-height: 1.3;
    }
  </style>
</head>

<body>
  <h3>Find Closest Named Color</h3>
  <blockquote>
    <em>You can have any color you want,<br>as long as it's named.</em>
    <quote>~ Henry Ford</quote>
  </blockquote>
  <input type="color" id="picker" value="#3c81f6">
  <input type="text" id="textInput" value="#3c81f6" placeholder="#rrggbb or #rgb">
  <div id="colorBox"></div>
  <p id="result"></p>
  <div id="mixedBox"></div>
  <p id="mixedResult"></p>

    function hexToLinearRGB(hex) {
      if (hex.length === 4)
        hex = "#" + [...hex.slice(1)].map(x => x + x).join('');
      const num = parseInt(hex.slice(1), 16);
      return [num >> 16 & 255, num >> 8 & 255, num & 255].map(v => {
        v /= 255;
        return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
      });
    }

    function perceptualDistance(a, b) {
      // DeltaE-like approximation in CIELAB
      function rgb2lab([r, g, b]) {
        // D65
        function f(t) { return t > 0.008856 ? t ** (1 / 3) : 7.787 * t + 16 / 116; }
        const X = r * 0.4124 + g * 0.3576 + b * 0.1805;
        const Y = r * 0.2126 + g * 0.7152 + b * 0.0722;
        const Z = r * 0.0193 + g * 0.1192 + b * 0.9505;
        const xr = X / 0.95047, yr = Y / 1.0, zr = Z / 1.08883;
        const fx = f(xr), fy = f(yr), fz = f(zr);
        return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
      }
      const la = rgb2lab(a), lb = rgb2lab(b);
      return (la[0] - lb[0]) ** 2 + (la[1] - lb[1]) ** 2 + (la[2] - lb[2]) ** 2;
    }

    function normalizeHex(input) {
      if (!input) return null;
      if (!input.startsWith('#')) input = '#' + input;
      if (/^#[0-9a-fA-F]{3}$/.test(input))
        input = "#" + [...input.slice(1)].map(x => x + x).join('');
      if (/^#[0-9a-fA-F]{6}$/.test(input)) return input.toLowerCase();
      const hex = input.replace(/[^0-9a-f]/gi, '').slice(0, 6);
      return hex.length ? '#' + hex.padEnd(6, '0').toLowerCase() : null;
    }

    function closestNamedColor(hex) {
      const rgb = hexToLinearRGB(hex);
      let best = null, min = Infinity;
      for (const [name, val] of Object.entries(CSS_COLORS)) {
        const d = perceptualDistance(rgb, hexToLinearRGB(val));
        if (d < min) { min = d; best = { name, hex: val }; }
      }
      return best;
    }

    function findBestColorMix(targetHex) {
      const targetRGB = hexToLinearRGB(targetHex);
      let best = null;
      let minDistance = Infinity;

      // Get all colors sorted by distance to target
      const sortedColors = Object.entries(CSS_COLORS)
        .map(([name, hex]) => ({
          name,
          hex,
          rgb: hexToLinearRGB(hex),
          distance: perceptualDistance(targetRGB, hexToLinearRGB(hex))
        }))
        .sort((a, b) => a.distance - b.distance);

      // Try mixing the closest colors with various ratios
      for (let i = 0; i < Math.min(10, sortedColors.length); i++) {
        for (let j = i + 1; j < Math.min(15, sortedColors.length); j++) {
          const color1 = sortedColors[i];
          const color2 = sortedColors[j];

          // Try different percentages
          for (let pct = 10; pct <= 90; pct += 5) {
            // Mix colors in linear RGB space
            const mixedRGB = color1.rgb.map((v, idx) =>
              v * (pct / 100) + color2.rgb[idx] * (1 - pct / 100)
            );

            const distance = perceptualDistance(targetRGB, mixedRGB);

            if (distance < minDistance) {
              minDistance = distance;
              best = {
                color1: color1.name,
                color2: color2.name,
                percentage: pct,
                distance: distance
              };
            }
          }
        }
      }

      return best;
    }

    const picker = document.getElementById('picker');
    const textInput = document.getElementById('textInput');
    const box = document.getElementById('colorBox');
    const result = document.getElementById('result');
    const mixedBox = document.getElementById('mixedBox');
    const mixedResult = document.getElementById('mixedResult');

    function update(value, source) {
      const norm = normalizeHex(value);
      if (!norm) {
        box.style.background = 'transparent';
        result.textContent = '';
        mixedBox.style.background = 'transparent';
        mixedResult.textContent = '';
        return;
      }

      const c = closestNamedColor(norm);
      box.style.background = c.hex;
      result.textContent = `Closest named color: ${c.name} (${c.hex})`;

      const mix = findBestColorMix(norm);
      if (mix) {
        const colorMixStr = `color-mix(in srgb, ${mix.color1} ${mix.percentage}%, ${mix.color2})`;
        mixedBox.style.background = colorMixStr;
        mixedResult.innerHTML = `Better match using color-mix:<br><code>${colorMixStr}</code>`;
      }

      if (source !== 'picker' && /^#[0-9a-f]{6}$/i.test(norm)) picker.value = norm;
      if (source !== 'text') textInput.value = value;
    }

    document.addEventListener('input', e => {
      if (e.target === picker) update(picker.value, 'picker');
      else if (e.target === textInput) update(textInput.value, 'text');
    });

    update('#3c81f6');
  </script>
